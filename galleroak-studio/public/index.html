<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="GallerOak Studio: a gallery of AI tools. Chat, reasoning, coding, agents, media, voice and integrations in one local workspace.">
  <title>GallerOak Studio</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icon-512.png">
  <link rel="stylesheet" href="app.css">
  <script>
    /* Apply the saved theme and layout state before first paint so nothing flashes. */
    try {
      var t = JSON.parse(localStorage.getItem('os.theme'));
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      document.documentElement.dataset.rail = JSON.parse(localStorage.getItem('os.rail')) === 'collapsed' ? 'collapsed' : 'expanded';
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="progress" id="progress" aria-hidden="true"><i></i></div>

  <div class="boot" id="boot" role="status" aria-live="polite" aria-label="Loading GallerOak Studio">
    <div class="boot-inner">
      <svg class="gk-mark boot-mark" viewBox="0 0 64 64" width="116" height="116" aria-hidden="true" focusable="false"><g transform="translate(2.56 2.9) scale(.92)"><path d="M52.85 35.72 A23 23 0 1 0 11.15 35.72" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".5"/><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><g stroke-width="2.5"><path d="M32 26 C 25 29, 20.154920898157048 36.72022002003608, 11.15 35.72"/><path d="M32 26 C 28 24, 18.08141571295791 20.5, 12.08 14.5"/><path d="M32 26 L 32 3"/><path d="M32 26 C 36 24, 45.918584287042094 20.5, 51.92 14.5"/><path d="M32 26 C 39 29, 43.84507910184294 36.7202200200361, 52.85 35.72"/></g><path d="M32 28 L32 45" stroke-width="4.2"/><g stroke-width="1.9"><path d="M32 42 C 28 49, 19 51, 10 52.5"/><path d="M32 43 C 28 50, 23 56, 20 61"/><path d="M32 44 C 31 50, 30.6 56, 30.2 62"/><path d="M32 44 C 33 50, 33.4 56, 33.8 62"/><path d="M32 43 C 36 50, 41 56, 44 61"/><path d="M32 42 C 36 49, 45 51, 54 52.5"/></g></g><g fill="currentColor"><circle cx="11.15" cy="35.72" r="3.5"/><circle cx="12.08" cy="14.5" r="3.5"/><circle cx="32" cy="3" r="3.5"/><circle cx="51.92" cy="14.5" r="3.5"/><circle cx="52.85" cy="35.72" r="3.5"/><path d="M32 19.6 L38.4 26 L32 32.4 L25.6 26 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></g><path d="M32 23.1 Q32.5 25.5 34.9 26 Q32.5 26.5 32 28.9 Q31.5 26.5 29.1 26 Q31.5 25.5 32 23.1 Z" fill="var(--mark-hole,#000)"/></g></svg>
      <div class="boot-word"><b>GallerOak</b><i>STUDIO</i></div>
      <div class="boot-tag">Gallery of AI tools</div>
      <div class="boot-bar"><i></i></div>
    </div>
  </div>

  <div class="app" id="app">
    <aside class="rail" id="rail" aria-label="Primary navigation">
      <div class="brand">
        <button class="brand-link" id="brandHome" type="button" title="Home">
          <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
          <span class="brand-text"><b>GallerOak</b><i>STUDIO</i></span>
        </button>
      </div>
      <nav id="nav"></nav>
      <div class="rail-foot">
        <button class="status" id="status" title="Click to open connection settings"><i class="dot"></i><span>Checking…</span></button>
        <button class="rail-toggle" id="railToggle" type="button" aria-controls="rail" aria-expanded="true" title="Collapse sidebar" data-tip-kbd="Ctrl B">
          <span class="rt-ico" id="railToggleIco"></span><span class="rt-label">Collapse</span>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim" aria-hidden="true"></div>
    <div class="main-col">
      <header class="m-bar">
        <button class="m-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="rail" aria-expanded="false"></button>
        <span class="m-brand" id="mBrand"></span>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script src="/shared/stm.js"></script>
  <script src="core.js"></script>
  <script src="brand.js"></script>
  <script src="connectors.js"></script>
  <script src="/shared/voice-text.js"></script>
  <script src="/shared/attach-rules.js"></script>
  <script src="/shared/chat-export.js"></script>
  <script src="holo.js"></script>
  <script src="voice.js"></script>
  <script src="interact.js"></script>
  <script src="chat.js"></script>
  <script src="builder.js"></script>
  <script src="rea.js"></script>
  <script src="media.js"></script>
  <script src="skills.js"></script>
  <script src="gateway.js"></script>
  <script src="comfy.js"></script>
  <script src="agent.js"></script>
  <script src="team.js"></script>
  <script src="settings.js"></script>
  <script src="home.js"></script>
  <script src="ux.js"></script>
  <script src="app.js"></script>
</body>
</html>
